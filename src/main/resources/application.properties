spring.application.name=servicehub-api

# Conexão com o PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/servicehub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:servicehub}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Migrações do banco de dados
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
services:
  db:
    image: postgres:16-alpine
    container_name: servicehub-db
    environment:
      POSTGRES_DB: servicehub
      POSTGRES_USER: servicehub
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - servicehub_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicehub -d servicehub"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: servicehub-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/servicehub
      SPRING_DATASOURCE_USERNAME: servicehub
      SPRING_DATASOURCE_PASSWORD: secret
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  servicehub_data: